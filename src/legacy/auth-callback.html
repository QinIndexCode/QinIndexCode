<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="auth.title">登录处理中...</title>
    <!-- Favicon（与 index.html 统一） -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="icon" type="image/webp" sizes="192x192" href="./assets/images/avatar.webp">
    <link rel="apple-touch-icon" href="./assets/images/avatar.webp">
    <link href="./css/css2.min.css" rel="stylesheet">
    <link href="./css/main.min.css" rel="stylesheet">
    <script src="./js/theme-tokens.js"></script>
    <script src="./js/i18n.js" defer></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            font-family: system-ui, -apple-system, sans-serif;
        }

        .loading-container {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--glass-border);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h1 {
            color: var(--text-primary);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .redirect-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .redirect-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <h1 data-i18n="auth.success">登录成功！</h1>
        <p data-i18n="auth.returning">正在返回到原页面...</p>
        <p>
            <span data-i18n="auth.notAuto">如果没有自动跳转，请</span>
            <a href="#" class="redirect-link" id="manual-redirect" data-i18n="auth.clickHere">点击这里</a>
        </p>
    </div>

    <script>
        // 获取重定向 URL
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirect');

        // 验证重定向 URL 的安全性
        function isValidRedirectUrl(url) {
            if (!url) return false;
            
            try {
                const parsedUrl = new URL(url);
                const currentOrigin = window.location.origin;
                
                // 只允许同源重定向
                if (parsedUrl.origin !== currentOrigin) {
                    console.warn('拒绝非同源重定向:', parsedUrl.origin);
                    return false;
                }
                
                // 验证路径是否合法（只允许 .html 文件）
                const path = parsedUrl.pathname;
                const allowedPaths = /^\/(index|home|tech|projects|blogs|tools|about|donate|auth-callback)?\.html$/;
                if (!allowedPaths.test(path) && path !== '/') {
                    console.warn('拒绝非法路径重定向:', path);
                    return false;
                }
                
                return true;
            } catch (e) {
                console.error('URL 解析失败:', e);
                return false;
            }
        }

        // 如果没有 redirect 参数或验证失败，默认返回到首页
        const targetUrl = isValidRedirectUrl(redirectUrl) 
            ? redirectUrl 
            : window.location.origin + '/index.html';

        // 设置手动跳转链接
        const manualLink = document.getElementById('manual-redirect');
        manualLink.href = targetUrl;

        // 延迟后自动跳转
        setTimeout(() => {
            window.location.href = targetUrl;
        }, 1500);
    </script>
</body>
</html>
