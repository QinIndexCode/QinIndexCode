    <!-- Synchronous theme application: runs before first paint, applies the
         full theme variable set so there is no flash of the wrong theme. -->
    <script src="./js/theme-tokens.js"></script>

<body>
    <!-- URL 路由修复：当服务器直接返回 index.html 但 URL 不是 / 时，
         自动重定向到 ?from=<page>#<hash>，确保 SPA 能加载正确页面 -->
    <script>
    (function() {
        var path = window.location.pathname;
        var hash = window.location.hash;
        var params = new URLSearchParams(window.location.search);
        if (params.get('from') || params.get('redirect')) return;
        var clean = path.replace(/^\/|\/$/g, '').replace(/\.html$/, '');
        if (!clean || clean === 'index') return;
        var validPages = ['home','projects','blogs','tools','donate','about'];
        var page = clean.replace(/\/.*/, '');
        if (validPages.indexOf(page) !== -1) {
            var url = '/?from=' + page;
            if (hash) url += hash;
            window.location.replace(url);
        }
    })();
    </script>

    <a href="#viewport" class="skip-link" data-i18n="common.skipLink">跳转到主内容</a>

    <button class="hamburger-btn" id="hamburger-btn" aria-label="打开菜单" data-i18n-aria-label="common.openMenu" aria-expanded="false" aria-controls="sidebar">

        <span></span>

            <svg class="icon icon-md theme-icon theme-icon-sun" aria-hidden="true"><use href="#i-sun"></use></svg>
        </button>
    </div>

                        <span data-i18n="nav.projects">项目</span>
                    </div>
                </li>
                <li class="nav-item" role="none">
                    <div class="nav-link" data-target="blogs" data-src="blogs.html" role="menuitem" tabindex="0">
                        <svg class="icon" aria-hidden="true"><use href="#i-book-open"></use></svg>
                        <span data-i18n="nav.blogs">随记</span>
                    </div>
                </li>
                <li class="nav-item" role="none">
                    <div class="nav-link" data-target="tools" data-src="tools.html" role="menuitem" tabindex="0">
